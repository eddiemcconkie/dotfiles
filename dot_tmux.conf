#########
# STYLE #
#########
set -g status-style bg=default
set -g message-style bg=green,fg=black,bold
setw -g window-status-current-style fg=black,bg=green,bold
setw -g window-status-current-format ' #I:#W '
setw -g window-status-style fg=white,bg=default

###########
# OPTIONS #
###########
set -s set-clipboard on
set -g allow-passthrough on
set -as terminal-features ',xterm-256color:clipboard'

############
# KEYBINDS #
############
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Set pane width to 80
bind C-w resize-pane -x 80

# Switch panes with Ctrl+Shift+h/j/k/l
bind-key -n C-S-h select-pane -L
bind-key -n C-S-j select-pane -D
bind-key -n C-S-k select-pane -U
bind-key -n C-S-l select-pane -R

# Open opencode/claude in a split pane and connect with sidekick
bind-key C-S-o split-window -h -l 80 \;\
    send-keys -t 1 "opencode" Enter \;\
    send-keys -t 0 ":Sidekick cli select" Enter \;\
    run-shell "sleep 2" \;\
    send-keys -t 0 Enter

bind-key C-S-c split-window -h -l 80 \;\
    send-keys -t 1 "claude" Enter \;\
    send-keys -t 0 ":Sidekick cli select" Enter \;\
    run-shell "sleep 2" \;\
    send-keys -t 0 Enter
